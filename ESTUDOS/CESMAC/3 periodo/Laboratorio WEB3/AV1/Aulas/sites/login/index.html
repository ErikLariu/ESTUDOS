<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar na sua conta</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo">
        <span class="logo-text">LOGO</span>
      </div>

      <h1>Entrar</h1>

      <form id="loginForm" autocomplete="off">
        <div class="form-step" id="stepEmail">
          <div class="input-group">
            <input
              type="text"
              id="email"
              name="email"
              placeholder="Email, telefone ou Skype"
              required
              autofocus
            />
          </div>
          <p class="helper-text">
            Não tem uma conta? <a href="#">Crie uma!</a>
          </p>
          <div class="actions">
            <button type="button" class="btn-primary" id="btnNext">Avançar</button>
          </div>
        </div>
      </form>
    </div>

    <div class="footer-links">
      <a href="#">Termos de uso</a>
      <a href="#">Privacidade e cookies</a>
    </div>
  </div>
</body>
</html>
